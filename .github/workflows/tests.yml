name: tests

# Started by hand only: Actions tab > this workflow > Run workflow. It does not start for a pull request or a push, so
# about 6 changes can be merged first and checked together once. Tick "Also run on Windows" to add the Windows tests.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: Also run on Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Players run the server on Windows, hosts mostly on Linux. A run is Linux only (Windows minutes cost more);
        # tick "Also run on Windows" when starting the workflow, before a release or after a change that may behave
        # differently there.
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Every test project: a test still running after 5 minutes counts as hung, and the run stops with a dump of the
      # test host and the list of the tests that were running (--blame-hang), instead of reaching the job's timeout.
      TEST_ARGS: --blame-hang-timeout 5m --blame-hang-dump-type mini
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit holds the floor of executed tests that this run's floor may not go below (the commit
          # before the one that is checked).
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      # Tests that need the client's exported game data are skipped here; the synthetic fixture
      # (tests/Ro3Emu.Tests/Fixtures/GameData, docs/guide/testing.md) lets the rest run. Each project writes to its own
      # folder, so its coverage file can be told apart. A failing project does not stop the next one.
      # A step that times out fails, so the steps below still run; a job that times out is cancelled and uploads nothing.
      - name: Server tests
        timeout-minutes: 24
        run: dotnet test tests/Ro3Emu.Tests -c Release --filter "Category!=Slow&Category!=Flaky" --logger "trx;LogFileName=server.trx" --results-directory TestResults/server ${{ env.TEST_ARGS }}
      - name: Patcher tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/Ro3Emu.Patcher.Tests -c Release --logger "trx;LogFileName=patcher.trx" --results-directory TestResults/patcher ${{ env.TEST_ARGS }}
      - name: Setup tests (RO3Emu.exe, data export, installer)
        if: ${{ !cancelled() }}
        run: dotnet test tests/Ro3Emu.Setup.Tests -c Release --filter "Category!=Slow" --logger "trx;LogFileName=setup.trx" --results-directory TestResults/setup ${{ env.TEST_ARGS }}
      # Fails when a project executed fewer tests than tests/test-floor.txt allows, or when that floor went down.
      - name: Executed and skipped tests
        if: always()
        shell: pwsh
        run: ./tools/test-summary.ps1 -Results TestResults -Floor tests/test-floor.txt
      # A failed run keeps its results for a week: the .trx files (every test's outcome and output) and, after a hang,
      # the blame sequence and the test host's dump.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore

  # The quarantine (docs/guide/testing.md): the tests marked Category=Flaky, each with up to two retries. Not a required
  # check and never red for a merge. A test only comes here with its reason and its date in that list.
  quarantine:
    name: quarantine (Category=Flaky)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Anything quarantined?
        run: |
          if grep -rqs --include='*.cs' 'Trait("Category", "Flaky")' tests; then echo 'any=true' >> "$GITHUB_OUTPUT"
          else echo 'Nothing is quarantined.'; fi
      - uses: actions/setup-dotnet@v6
        if: steps.list.outputs.any == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - name: Flaky tests
        if: steps.list.outputs.any == 'true'
        timeout-minutes: 24
        run: |
          dotnet build tests/Ro3Emu.Tests -c Release
          for attempt in 1 2 3; do
            dotnet test tests/Ro3Emu.Tests -c Release --no-build --filter "Category=Flaky" --blame-hang-timeout 5m && exit 0
          done
          exit 1

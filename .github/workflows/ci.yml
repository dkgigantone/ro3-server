name: Client-independent .NET checks

# Started by hand only: Actions tab > this workflow > Run workflow. It does not start for a pull request or a push, so
# about 6 changes can be merged first and checked together once. Tick "Also run on Windows" to add the Windows build below.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: Also run on Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Layout rules are in .editorconfig. Fix locally with: dotnet format whitespace --folder
      - name: Check C# layout
        run: dotnet format whitespace --folder --verify-no-changes

  # Rebuilds everything that builds without the client with the baseline rules as warnings, and fails when a rule's
  # count no longer matches the one in .editorconfig, or when .editorconfig got looser than in the parent commit
  # (tools/AnalyzerBaseline).
  analyzer-baseline:
    name: Analyzer baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit holds the counts this run's baseline may not rise above.
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - name: Check the analyzer baseline
        run: dotnet run --project tools/AnalyzerBaseline -c Release

  # The release packs the committed prebuilt/client DLLs; it refuses them when they were built from other hooks or
  # loc sources. This fails the change that makes them stale instead of the next release.
  prebuilt-client:
    name: Prebuilt client DLLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check prebuilt/client against the hooks and loc sources
        run: ./tools/release/client-stamp.ps1 -Check
        shell: pwsh

  # The server, the setup tool and the patcher are built and tested on Linux and Windows by tests.yml; this job
  # builds what no test project references.
  # Windows minutes cost more than Linux ones: this job only runs when "Also run on Windows" is ticked (before a
  # release, or after a change to the launcher or the export tools).
  build:
    name: Export tools and launcher build
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      # Compiler and analyzer warnings are errors (Directory.Build.props); warnings of MSBuild tasks such as protoc
      # are not.
      - name: Build export tools, bot CLI and launcher
        run: |
          foreach ($project in 'tools/LuaDecode', 'tools/ConfigExport', 'tools/ProtoDump', 'src/Ro3Emu.BotCli', 'src/Ro3Emu.Launcher') {
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh

name: Discord notify

# Posts a card (event, number, title and the main section of the body) to Discord. No links, no repo name.
# Needs two repository secrets: DISCORD_ISSUES_WEBHOOK and DISCORD_PRS_WEBHOOK.

on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed]

permissions: {}

jobs:
  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Post to #issues
        env:
          WEBHOOK: ${{ secrets.DISCORD_ISSUES_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          case "$ACTION" in
            opened) LABEL="Issue #${NUMBER} · Opened"; COLOR=15965202 ;;
            *)      LABEL="Issue #${NUMBER} · Closed"; COLOR=3066993 ;;
          esac
          CLEAN=$(printf '%s' "$BODY" | tr -d '\r' | grep -vi '^closes #' || true)
          DESC=$(printf '%s\n' "$CLEAN" | awk 'tolower($0) ~ /^## /{ if (on) exit; on = (tolower(substr($0,4)) == "problem"); next } on')
          [ -n "$DESC" ] || DESC="$CLEAN"
          DESC=$(printf '%s' "$DESC" | head -c 1500)
          jq -n --arg label "$LABEL" --arg title "$TITLE" --arg desc "$DESC" --argjson color "$COLOR" \
            '{allowed_mentions: {parse: []}, embeds: [{author: {name: $label}, title: $title, description: $desc, color: $color, footer: {text: "Eclipse Project"}, timestamp: (now | todate)}]}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post to #pull-requests
        env:
          WEBHOOK: ${{ secrets.DISCORD_PRS_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          if [ "$ACTION" = "opened" ]; then LABEL="Pull Request #${NUMBER} · Opened"; COLOR=3447003
          elif [ "$MERGED" = "true" ]; then LABEL="Pull Request #${NUMBER} · Merged"; COLOR=10181046
          else LABEL="Pull Request #${NUMBER} · Closed"; COLOR=15158332; fi
          CLEAN=$(printf '%s' "$BODY" | tr -d '\r' | grep -vi '^closes #' || true)
          DESC=$(printf '%s\n' "$CLEAN" | awk 'tolower($0) ~ /^## /{ if (on) exit; on = (tolower(substr($0,4)) == "what changes"); next } on')
          [ -n "$DESC" ] || DESC="$CLEAN"
          DESC=$(printf '%s' "$DESC" | head -c 1500)
          jq -n --arg label "$LABEL" --arg title "$TITLE" --arg desc "$DESC" --argjson color "$COLOR" \
            '{allowed_mentions: {parse: []}, embeds: [{author: {name: $label}, title: $title, description: $desc, color: $color, footer: {text: "Eclipse Project"}, timestamp: (now | todate)}]}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"

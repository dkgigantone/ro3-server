<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RO3 Plus - Mob Editor</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f0f3f8; --line:#dfe5ee; --text:#1b2433; --muted:#6a778c;
  --accent:#3b6df0; --accent-d:#2c55c7; --ok:#18a56b; --warn:#c98a0b; --bad:#d6404f; --chip:#e8eefc; --edit:#fff6dc;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1420; --panel:#151d2c; --panel2:#1b2638; --line:#27344b; --text:#e6ecf6; --muted:#8c9bb3;
  --accent:#6b93ff; --accent-d:#5a82f0; --ok:#3ccf91; --warn:#f0b64a; --bad:#ff7380; --chip:#22314f; --edit:#3a3216;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:8px}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-d)}
button.primary:disabled{opacity:.5;cursor:default}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);background:var(--panel2)}
input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header .path{color:var(--muted);font-size:12px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .spacer{flex:1}
nav.top{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:10px}
nav.top a{padding:5px 14px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}
nav.top a.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
details.more{position:relative}
details.more summary{list-style:none;cursor:pointer;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.more summary::-webkit-details-marker{display:none}
details.more .menu{position:absolute;right:0;top:110%;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;gap:4px;min-width:260px}
details.more .menu button{text-align:left;border-color:transparent}
.banner{margin:12px 20px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:var(--warn)} .banner.bad{border-color:var(--bad)} .banner.ok{border-color:var(--ok)}
.banner .grow{flex:1}
.tabs{display:flex;gap:2px;padding:10px 20px 0;flex-wrap:wrap}
.tabs .tab{padding:8px 18px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--panel2);color:var(--muted);font-weight:600;cursor:pointer}
.tabs .tab.on{background:var(--panel);color:var(--text)}
.tabs .tab small{font-weight:400;margin-left:6px}
.classes{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;margin:0 20px;background:var(--panel);border:1px solid var(--line);border-top:0;align-items:center}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.75;margin-left:4px}
.hint{color:var(--muted);font-size:12px}
main{flex:1;overflow:auto;padding:0 20px 20px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;box-shadow:var(--shadow);overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.num input{width:100%;max-width:120px;text-align:right}
td.name{white-space:normal;min-width:180px}
td.dim{color:var(--muted)}
td.ed input,td.ed select{background:var(--edit);border-color:var(--warn)}
tr.look td.sells{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--muted);margin-left:6px}
.warnicon{color:var(--warn);font-weight:700;cursor:help}
.addbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.addbar input{width:110px} .addbar .nm{min-width:160px;color:var(--muted)}
tr.added td:first-child{border-left:3px solid var(--ok)}
.tag.new{background:var(--ok);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:center;justify-content:center;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(860px,94vw);max-height:86vh;display:flex;flex-direction:column}
.modal .box h2{margin:0;padding:14px 18px;font-size:16px;border-bottom:1px solid var(--line)}
.modal .body{padding:12px 18px;overflow:auto;flex:1}
.modal .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.err{color:var(--bad);margin:2px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:30;max-width:80vw}
.toast.ok{background:var(--ok)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px}
.filters input[type=search]{width:200px} .filters input.n{width:70px}
.split{display:flex;gap:14px;padding:0 20px 20px;flex:1;min-height:0}
.split .list{flex:1.4;min-width:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.split .detail{flex:1;min-width:380px;max-width:760px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
tr.row{cursor:pointer} tr.row:hover td{background:var(--panel2)} tr.row.sel td{background:var(--chip)}
tr.row.edited td:first-child{border-left:3px solid var(--warn)}
.pager{display:flex;gap:10px;align-items:center;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin:10px 0}
.grid label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.grid input,.grid select{width:100%}
.grid label.ed input,.grid label.ed select{background:var(--edit);border-color:var(--warn)}
.grid .orig{font-size:11px;color:var(--muted)}
.detail h2{margin:0 0 2px;font-size:17px} .detail h3{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.ro{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px} .ro span:nth-child(odd){color:var(--muted)}
.mini th,.mini td{padding:4px 8px;font-size:13px}
.drop{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.drop.ed{border-color:var(--warn);background:var(--edit)}
.drop.dead{opacity:.55}
.drop .top{display:flex;gap:8px;align-items:center}
.drop .top .nm{flex:1;font-weight:600}
.drop .f{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;margin-top:6px}
.drop .f label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.drop .f input,.drop .f select{width:100%}
.drop .eff{font-size:12px;margin-top:5px;color:var(--muted)}
.dropbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.dropbar input{width:140px}
.found{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;margin:4px 0;max-height:180px;overflow:auto}
.found button{text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line)}
.tag.mvp{background:var(--bad);color:#fff} .tag.boss{background:var(--warn);color:#fff}
</style>
</head>
<body>
<header>
  <h1>RO3 Plus Config Editor</h1>
  <nav class="top"><a href="/">Skills</a><a href="/items">Items</a><a href="/shops">Shops</a><a href="/texts">Descriptions</a><a href="/mobs" class="on">Mobs</a></nav>
  <span class="path" id="home"></span>
  <span class="pill" id="pill">...</span>
  <span class="spacer"></span>
  <button class="primary" id="btnApply" disabled>Apply to game</button>
  <details class="more"><summary>More</summary><div class="menu">
    <button id="btnRestore">Put the untouched originals back</button>
    <button id="btnDiscard">Discard all my edits</button>
    <button id="btnRebase">Use current files as new original</button>
  </div></details>
</header>
<div id="banner"></div>
<div class="filters">
  <input type="search" id="q" placeholder="Name or id">
  Level <input class="n" id="lo" type="number" min="0" placeholder="from"> <input class="n" id="hi" type="number" min="0" placeholder="to">
  <select id="cls"><option value="all">All monsters</option><option value="normal">Normal</option><option value="boss">Boss type</option><option value="mvp">MVP list</option></select>
  <select id="race"></select><select id="size"></select><select id="element"></select>
  <select id="sort"><option value="level">Sort: level</option><option value="name">Sort: name</option><option value="hp">Sort: HP</option><option value="exp">Sort: Base EXP</option><option value="id">Sort: id</option></select>
  <label><input type="checkbox" id="desc"> descending</label> <label><input type="checkbox" id="unnamed"> show unnamed rows</label>
  <span class="hint" id="count"></span>
</div>
<div class="split">
  <div class="list"><table><thead><tr><th>Id</th><th>Name</th><th>Lv</th><th>Class</th><th>Race</th><th>Size</th><th>Element</th><th>HP</th><th>Atk</th><th>Base EXP</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="pager"><button id="prev">Prev</button><span id="pageInfo"></span><button id="next">Next</button></div></div>
  <div class="detail" id="detail"><div class="empty">Pick a monster on the left.</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let DR = null, META = null, page = 1, total = 0, LIMIT = 100, cur = null, LAST = null;
const STAT_KEYS = ["hp","sp","atk","matk","pdef","mdef","hit","flee","crit"];
const STAT_LABEL = {hp:"HP",sp:"SP",atk:"Atk",matk:"Matk",pdef:"Pdef",mdef:"Mdef",hit:"Hit",flee:"Flee",crit:"Crit"};
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, ok){ const t=$("toast"); t.textContent=msg; t.className="toast"+(ok?" ok":""); t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none", ok?9000:7000); }
async function api(path, body){
  const r = await fetch(path, body===undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const t = await r.text(); let j; try{ j=JSON.parse(t);}catch(e){ j=null; }
  if(!r.ok) throw new Error((j&&j.error)||t||("HTTP "+r.status));
  return j ?? t;
}
const nm = (map, id) => map[id] ?? "#"+id;
function fillSelect(el, label, map){ el.innerHTML = '<option value="-1">'+label+'</option>' + Object.entries(map).map(([k,v])=>'<option value="'+k+'">'+esc(v)+'</option>').join(""); }
function renderMeta(){
  const m = META; $("home").textContent = m.home;
  const p = $("pill");
  if(m.fileStatus==="external"){ p.textContent="files changed outside"; p.className="pill warn"; }
  else if(m.changedRows===0 && m.fileStatus==="pristine"){ p.textContent="original"; p.className="pill ok"; }
  else if(m.inSync){ p.textContent="applied"; p.className="pill ok"; }
  else { p.textContent=m.changedRows+" monster"+(m.changedRows===1?"":"s")+" edited, not applied"; p.className="pill warn"; }
  $("btnApply").disabled = m.fileStatus==="external" || m.inSync || (m.changedRows===0 && m.fileStatus==="pristine");
  let b = "";
  if(m.fileStatus==="external") b = '<div class="banner bad"><span class="grow">NPCConfig, AttriMonsterConfig or AIConfig changed outside this tool. Use More &gt; Use current files as new original before applying.</span></div>';
  else if(m.serverRunning) b = '<div class="banner warn"><span class="grow">The server is running. It reads these tables at start-up: apply, then restart it.</span></div>';
  $("banner").innerHTML = b;
}
function query(){
  const p = new URLSearchParams({q:$("q").value, lo:$("lo").value||0, hi:$("hi").value||0, cls:$("cls").value, race:$("race").value, size:$("size").value,
    element:$("element").value, sort:$("sort").value, desc:$("desc").checked?1:0, unnamed:$("unnamed").checked?1:0, page, limit:LIMIT});
  return p.toString();
}
async function load(){
  const d = await api("/api/mobs/search?"+query()); total = d.total;
  $("count").textContent = total+" monsters";
  const pages = Math.max(1, Math.ceil(total/LIMIT)); if(page>pages){ page=pages; return load(); }
  $("pageInfo").textContent = "Page "+page+" of "+pages; $("prev").disabled = page<=1; $("next").disabled = page>=pages;
  $("rows").innerHTML = d.mobs.map(r => '<tr class="row'+(r.edited.length?" edited":"")+(cur===r.id?" sel":"")+'" data-id="'+r.id+'"><td>'+r.id+'</td><td>'+esc(r.name||"(no name)")+'</td><td>'+r.level+'</td><td>'
    +(r.class==="normal"?"":'<span class="tag '+r.class+'">'+r.class.toUpperCase()+'</span>')+'</td><td>'+esc(nm(META.races,r.race))+'</td><td>'+esc(nm(META.sizes,r.size))+'</td><td>'+esc(nm(META.elements,r.element))+'</td><td>'+(r.hp||0).toLocaleString()+'</td><td>'+(r.atk||0).toLocaleString()+'</td><td>'+(r.exp||0).toLocaleString()+'</td></tr>').join("")
    || '<tr><td colspan="10" class="empty">No monsters match.</td></tr>';
}
async function open(id){
  cur = id;
  try{ const d = await api("/api/mobs/get?id="+id); META = d.meta; if(stale(META)) return; renderMeta(); showDetail(d); }catch(e){ toast("Could not show this monster: "+e.message); return; }
  document.querySelectorAll("tr.row").forEach(tr => tr.classList.toggle("sel", +tr.dataset.id===id));
}
function stale(m){ if(m && m.limits && m.limits.exp) return false; toast("The config editor program is older than this page. Close its window, run start.bat again, then press Ctrl+F5."); return true; }
function showDetail(d){
  LAST = d; const m = d.mob, o = d.original, ed = new Set(m.edited);
  const num = (k,label,min,max,step) => '<label class="'+(ed.has(k)?"ed":"")+'">'+label+'<input type="number" data-k="'+k+'" value="'+m[k]+'" min="'+min+'" max="'+max+'" step="'+(step||1)+'"><span class="orig">original '+o[k]+'</span></label>';
  const sel = (k,label,map) => '<label class="'+(ed.has(k)?"ed":"")+'">'+label+'<select data-k="'+k+'">'+Object.entries(map).map(([v,t])=>'<option value="'+v+'"'+(+v===m[k]?" selected":"")+'>'+esc(t)+'</option>').join("")+'</select><span class="orig">original '+esc(nm(map,o[k]))+'</span></label>';
  const L = META.limits;
  let h = '<h2>'+esc(m.name||"(no name)")+' <span class="hint">#'+m.id+' &middot; level '+m.level+'</span></h2>'
    + '<div class="hint">'+(m.mvp?'<span class="tag mvp">MVP LIST</span> ':'')+(m.class==="boss"?'<span class="tag boss">BOSS TYPE</span> ':'')+'sub type '+m.subType+' &middot; stats row '+(m.sharedAttrRow||"by level")+' (shared, never edited: this monster gets its own row on Apply)</div>'
    + '<h3>Stats</h3><div class="grid">'+STAT_KEYS.map(k=>num(k,STAT_LABEL[k],L[k][0],L[k][1])).join("")+'</div>'
    + '<h3>Experience per kill</h3><div class="grid">'+num("exp","Base EXP",L.exp[0],L.exp[1])
    + '<label>Job EXP (linked)<input type="number" id="jobExp" value="'+m.jobExp+'" min="0"><span class="orig">original '+o.jobExp+'</span></label></div>'
    + '<div class="hint">Job EXP is always '+(META.jobPct/100)+'% of the Base EXP (a server-wide rule), so changing either one changes the Base EXP. These are the numbers before the killer\'s level-gap correction and any team or field-rate bonus.'
    + (m.expSources? '' : ' This monster gives no Base EXP today: a number above 0 adds it.')+'</div>'
    + '<h3>Type and movement</h3><div class="grid">'+sel("element","Element",META.elements)+sel("race","Race",META.races)+sel("size","Size",META.sizes)
    + num("speed","Walk speed",L.speed[0],L.speed[1])+num("chase","Chase range (m)",L.chase[0],L.chase[1],0.5)+'</div>'
    + (m.chaseLocked?'<div class="hint">Chase range is locked: this monster uses the aggressive AI (20000004).</div>':'')
    + '<div style="display:flex;gap:8px;margin:8px 0"><button class="primary" id="save">Save</button><button id="reset">Back to original</button></div>'
    + '<h3>Read-only (from its skills and AI)</h3><div class="ro"><span>Attack range</span><span>'+m.attackRange+' m'+(m.ownAttack?"":" (server default, no normal attack listed)")+'</span>'
    + '<span>Attack interval (ASPD)</span><span>'+m.swingMs+' ms per swing</span><span>Skill range</span><span>'+(m.skillRange==null?"no other skills":m.skillRange+" m ("+m.skills+" skill"+(m.skills===1?"":"s")+")")+'</span><span>View range</span><span>'+m.view+' m</span><span>AI</span><span>'+m.ai+'</span></div>'
    + '<h3>Item drops</h3><div id="dropsBox"></div>'
    + '<h3>Spawn maps</h3><div id="spawnBox" class="hint">Loading the spawn data...</div>';
  if(d.drops.exp.length) h += '<div class="hint">Base EXP rows: '+d.drops.exp.map(x=>x.min===x.max?x.min:x.min+"-"+x.max).join(", ")+' (edit with the Base EXP field above)</div>';
  $("detail").innerHTML = h;
  $("save").onclick = save; $("reset").onclick = resetMob;
  DR = {list: JSON.parse(JSON.stringify(d.drops.items)), saved: d.drops.edited, level: DR && DR.id===m.id ? DR.level : "", sel: 0, id: m.id, mobLevel: m.level, dirty: false};
  renderDrops();
  loadSpawns(m.id);
  const base = document.querySelector('#detail [data-k="exp"]'), job = $("jobExp"), pct = META.jobPct;
  base.addEventListener("input", () => { job.value = Math.floor(Number(base.value||0)*pct/10000); });
  job.addEventListener("input", () => { base.value = pct>0 ? Math.ceil(Number(job.value||0)*10000/pct) : 0; job.value = Math.floor(Number(base.value)*pct/10000); });
}

function planText(plan){
  const rows = (META.plans||{})[plan]; if(!rows) return "";
  return rows.map(r => (r[0]===r[1]?r[0]:r[0]+" to "+r[1])+": "+(r[2]/100)+"%").join(" | ");
}
function ratioAt(plan, gap){
  const rows = (META.plans||{})[plan]; if(!plan || !rows) return 10000;
  for(const r of rows) if(gap>=r[0] && gap<=r[1]) return r[2];
  return 10000;
}
function effText(e){
  const L = Number(DR.level); if(!DR.level || Number.isNaN(L)) return "";
  if(L < e.minLevel || (e.maxLevel && L > e.maxLevel)) return "Not dropped at player level "+L+" (needs "+e.minLevel+" to "+(e.maxLevel||"any")+").";
  const gap = L - DR.mobLevel, ratio = ratioAt(e.plan, gap);
  if(!e.plan) return "At player level "+L+": "+e.perKill+"% per kill, no level penalty.";
  return "At player level "+L+" (gap "+gap+"): quantity x "+(ratio/100)+"%, so about "+(Math.round(e.perKill*ratio/100)/100)+"% per kill for a single item.";
}
function renderDrops(){
  const box = $("dropsBox"); if(!box) return;
  const plans = Object.keys(META.plans||{});
  let h = '<div class="dropbar"><label class="hint">Check at player level <input type="number" id="dlvl" class="n" min="1" max="999" value="'+esc(DR.level)+'"></label>'
    + '<span class="hint">'+(plans.length?"Penalty plans: "+plans.map(p=>"plan "+p+" ("+planText(p)+")").join("; "):"")+'</span></div>';
  if(DR.sel >= DR.list.length) DR.sel = Math.max(0, DR.list.length-1);
  if(DR.list.length){
    h += '<div class="dropbar"><select id="dsel" style="flex:1;min-width:240px">'+DR.list.map((e,i) => '<option value="'+i+'"'+(i===DR.sel?" selected":"")+'>'+esc((e.name||("item "+e.item))+" #"+e.item+" - "+e.perKill+"% per kill, qty "+(e.min===e.max?e.min:e.min+"-"+e.max))+'</option>').join("")+'</select><span class="hint">'+DR.list.length+' drop'+(DR.list.length===1?"":"s")+'</span></div>';
    const e = DR.list[DR.sel], i = DR.sel;
    h += '<div class="drop'+(effText(e).startsWith("Not dropped")?" dead":"")+'" data-i="'+i+'"><div class="top"><span class="nm">'+esc(e.name||("item "+e.item))+' <span class="hint">#'+e.item+'</span></span>'
      + '<span class="hint pk">'+e.perKill+'% per kill</span><button class="ghost" data-del="'+i+'" title="Remove this drop">Remove</button></div>'
      + '<div class="f">'
      + '<label>Chance % (each roll)<input type="number" data-f="chance" min="0.0001" max="100" step="0.01" value="'+e.chance+'"></label>'
      + '<label>Rolls per kill<input type="number" data-f="rolls" min="1" max="1000" value="'+e.rolls+'"></label>'
      + '<label>Qty min<input type="number" data-f="min" min="0" value="'+e.min+'"></label>'
      + '<label>Qty max<input type="number" data-f="max" min="0" value="'+e.max+'"></label>'
      + '<label>Player level from<input type="number" data-f="minLevel" min="0" max="999" value="'+e.minLevel+'"></label>'
      + '<label>Player level to<input type="number" data-f="maxLevel" min="0" max="999" value="'+e.maxLevel+'"></label>'
      + '<label>Level penalty plan<select data-f="plan"><option value="0"'+(e.plan?"":" selected")+'>None</option>'+plans.map(p=>'<option value="'+p+'"'+(+p===e.plan?" selected":"")+'>Plan '+p+'</option>').join("")+'</select></label>'
      + '<label>Limits<span class="hint" style="padding-top:6px">'+(e.quest?"quest "+e.quest+". ":"")+(e.maps&&e.maps.length?"maps "+e.maps.join(",")+". ":"")+(!e.quest&&!(e.maps&&e.maps.length)?"none":"")+'</span></label>'
      + '</div><div class="eff">'+esc(effText(e))+'</div></div>';
  } else h += '<div class="hint">No item drops.</div>';
  h += '<div class="dropbar"><input type="search" id="addq" placeholder="Add item: name or id"><button id="addgo">Search</button></div><div id="found"></div>'
    + '<div style="display:flex;gap:8px;margin:8px 0"><button class="primary" id="dsave"'+(DR.dirty?"":" disabled")+'>Save drops</button><button id="dreset"'+(DR.saved||DR.dirty?"":" disabled")+'>Back to original drops</button></div>'
    + '<div class="hint">Saving rewrites all of this monster\'s item drops as independent rolls with the chances shown here (a one-of-several group becomes separate rolls). Other monsters are not changed. Base EXP is not part of this list. The penalty plan scales the quantity by the level gap (player level minus monster level).</div>';
  box.innerHTML = h;
  box.querySelectorAll(".drop [data-f]").forEach(el => el.addEventListener("input", () => {
    const e = DR.list[+el.closest(".drop").dataset.i], f = el.dataset.f, n = Number(el.value);
    if(el.value==="" || Number.isNaN(n)) return;
    e[f] = f==="plan" ? n : n; if(f==="chance"||f==="rolls") e.perKill = Math.round((1-Math.pow(1-e.chance/100, e.rolls))*1e6)/1e4;
    DR.dirty = true; $("dsave").disabled = false; $("dreset").disabled = false;
    const opt = $("dsel") && $("dsel").options[DR.sel]; if(opt) opt.textContent = (e.name||("item "+e.item))+" #"+e.item+" - "+e.perKill+"% per kill, qty "+(e.min===e.max?e.min:e.min+"-"+e.max);
    const card = el.closest(".drop"); card.querySelector(".pk").textContent = e.perKill+"% per kill"; card.querySelector(".eff").textContent = effText(e);
  }));
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { DR.list.splice(+b.dataset.del,1); DR.sel = Math.max(0, +b.dataset.del-1); DR.dirty = true; renderDrops(); });
  if($("dsel")) $("dsel").onchange = () => { DR.sel = +$("dsel").value; renderDrops(); };
  $("dlvl").addEventListener("input", () => { DR.level = $("dlvl").value; const keep = DR.list; renderDrops(); $("dlvl").focus(); });
  $("addgo").onclick = findItems; $("addq").addEventListener("keydown", ev => { if(ev.key==="Enter") findItems(); });
  $("dsave").onclick = saveDrops;
  $("dreset").onclick = async () => { try{ const d = await api("/api/mobs/drops", {id:cur, drops:null}); META = d.meta; renderMeta(); showDetail(d); await load(); toast("Drops back to the original.", true);}catch(e){toast(e.message);} };
}
async function findItems(){
  const q = $("addq").value.trim(); if(!q) return;
  try{
    const d = await api("/api/mobs/items?q="+encodeURIComponent(q));
    $("found").innerHTML = d.items.length ? '<div class="found">'+d.items.map(x => '<button data-add="'+x.id+'" data-name="'+esc(x.name)+'">'+esc(x.name)+' <span class="hint">#'+x.id+'</span></button>').join("")+'</div>' : '<div class="hint">No item found.</div>';
    $("found").querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
      DR.list.push({item:+b.dataset.add, name:b.dataset.name, chance:10, rolls:1, perKill:10, min:1, max:1, minLevel:0, maxLevel:999, plan:0, quest:0, maps:[], src:null});
      DR.sel = DR.list.length-1; DR.dirty = true; renderDrops();
    });
  }catch(e){ toast(e.message); }
}
async function saveDrops(){
  try{ const d = await api("/api/mobs/drops", {id:cur, drops:DR.list.map(({item,chance,rolls,min,max,minLevel,maxLevel,plan,quest,maps,src}) => ({item,chance,rolls,min,max,minLevel,maxLevel,plan,quest,maps,src}))});
    META = d.meta; renderMeta(); showDetail(d); await load(); toast("Drops saved. Press Apply to game to write them.", true); }
  catch(e){ toast(e.message); }
}
async function save(){
  const v = {};
  document.querySelectorAll("#detail [data-k]").forEach(el => { const k = el.dataset.k; const n = Number(el.value); if(el.value==="" || Number.isNaN(n)) v[k]=null; else v[k]=n; });
  try{ const d = await api("/api/mobs/set", {id:cur, values:v}); META = d.meta; renderMeta(); showDetail(d); await load(); toast("Saved. Press Apply to game to write it.", true); }
  catch(e){ toast(e.message); }
}
async function resetMob(){ try{ const d = await api("/api/mobs/reset", {id:cur}); META = d.meta; renderMeta(); showDetail(d); await load(); toast("Back to the original.", true);}catch(e){toast(e.message);} }
let SP = null;
async function loadSpawns(id){
  const box = $("spawnBox"); if(!box) return;
  try{ const d = await api("/api/spawns/get?id="+id); if(cur !== id) return; SP = {d, pools: JSON.parse(JSON.stringify(d.pools)), fixed: JSON.parse(JSON.stringify(d.fixed)), dirty:false, id}; renderSpawns(); }
  catch(e){ if(cur === id) box.textContent = "Could not read the spawn data: "+e.message; }
}
function spawnBar(m){
  const st = m.fileStatus==="external" ? "a scene file was changed outside this tool" : m.fileStatus==="applied" ? "applied" : "untouched";
  return '<div class="hint">Spawn edits saved: <b>'+m.changed+'</b> &middot; scene files: '+st+(m.inSync?"":" &middot; <b>not applied yet</b>")+'</div>'
    + '<div style="display:flex;gap:8px;margin:6px 0;flex-wrap:wrap"><button class="primary" id="spApply">Apply spawns to game</button><button id="spRestore">Restore original spawn files</button>'
    + '<button class="ghost" id="spDiscard">Discard all spawn edits</button>'+(m.fileStatus==="external"?'<button id="spRebase">Use current scene files as new original</button>':'')+'</div>';
}
function renderSpawns(){
  const box = $("spawnBox"); if(!box || !SP) return; const d = SP.d, mx = d.meta.countMax;
  const warn = r => r.usedMax > r.points ? ' <span class="warnicon" title="The monsters in this group ask for up to '+r.usedMax+' but it only has '+r.points+' spawn points, so some will not appear.">!</span>' : "";
  let h = '<div class="hint">Where this monster appears on the public maps. In a <b>pool</b> group each monster spawns a random number from min to max when the map loads, and a killed one comes back after the group\'s respawn time. Changes need Apply spawns to game, then a server restart.</div>';
  if(!SP.pools.length && !SP.fixed.length) h += '<div class="empty">This monster is not on any map yet. Use Add to a map below.</div>';
  if(SP.pools.length){
    h += '<div style="overflow-x:auto"><table><tr><th>Map</th><th>Group</th><th>Min</th><th>Max</th><th>Points</th><th></th></tr>' + SP.pools.map((r,i) => {
      const was = r.origMin==null ? '<span class="tag new">NEW</span>' : (r.origMin===r.min && r.origMax===r.max ? "" : '<span class="hint">was '+r.origMin+(r.origMax!==r.origMin?"-"+r.origMax:"")+'</span>');
      return '<tr class="'+(r.origMin==null?"added":"")+'"><td class="name" style="min-width:120px">'+esc(r.map)+' <span class="hint">#'+r.mapId+'</span></td><td>'+r.group+'</td>'
        + '<td class="num'+(r.origMin!==r.min?" ed":"")+'"><input type="number" min="0" max="'+mx+'" style="width:72px" data-sp="min" data-i="'+i+'" value="'+r.min+'"></td>'
        + '<td class="num'+(r.origMax!==r.max?" ed":"")+'"><input type="number" min="0" max="'+mx+'" style="width:72px" data-sp="max" data-i="'+i+'" value="'+r.max+'"></td>'
        + '<td class="dim">'+r.points+warn(r)+'</td><td style="white-space:normal">'+was+' <button class="ghost" data-spdel="'+i+'" title="Remove from this map">Remove</button></td></tr>'; }).join("") + '</table></div>';
  }
  if(SP.fixed.length){
    h += '<div class="hint" style="margin-top:8px">Fixed spawn points: how many points of the group are filled at once. Points are not added or removed here.</div><table><tr><th>Map</th><th>Group</th><th>Alive at once</th><th>Points</th></tr>' + SP.fixed.map((r,i) =>
      '<tr><td class="name">'+esc(r.map)+' <span class="hint">#'+r.mapId+'</span></td><td>'+r.group+'</td><td class="num'+(r.total!==r.origTotal?" ed":"")+'"><input type="number" min="1" max="'+r.points+'" style="width:72px" data-spf="'+i+'" value="'+r.total+'"></td>'
      + '<td class="dim">'+r.mine+' of this monster / '+r.points+' ('+r.kinds+' type'+(r.kinds===1?"":"s")+')'+(r.kinds>1?' <span class="warnicon" title="The alive total is shared with the other monsters of this group.">!</span>':'')+'</td></tr>').join("") + '</table>';
  }
  h += '<div class="addbar"><select id="spAddSel" style="max-width:230px"><option value="">Add to a map (pool groups)...</option>'
    + d.addable.filter(a => !SP.pools.some(p => p.scene===a.scene && p.group===a.group)).map((a,i) => '<option value="'+a.scene+'|'+a.group+'">'+esc(a.map)+' - group '+a.group+' ('+a.kinds+' monster type'+(a.kinds===1?"":"s")+', '+a.points+' points)</option>').join("")
    + '</select><span class="hint">min</span><input type="number" id="spAddMin" style="width:72px" min="0" max="'+mx+'" value="5"><span class="hint">max</span><input type="number" id="spAddMax" style="width:72px" min="0" max="'+mx+'" value="5"><button id="spAdd">Add</button></div>'
    + '<div style="display:flex;gap:8px;margin:8px 0"><button class="primary" id="spSave"'+(SP.dirty?"":" disabled")+'>Save spawns</button><button id="spReset">Back to original spawns</button></div>'
    + spawnBar(d.meta);
  box.className = ""; box.innerHTML = h;
  box.querySelectorAll("[data-sp]").forEach(el => el.addEventListener("input", () => { SP.pools[+el.dataset.i][el.dataset.sp] = Number(el.value); SP.dirty = true; $("spSave").disabled = false; }));
  box.querySelectorAll("[data-spf]").forEach(el => el.addEventListener("input", () => { SP.fixed[+el.dataset.spf].total = Number(el.value); SP.dirty = true; $("spSave").disabled = false; }));
  box.querySelectorAll("[data-spdel]").forEach(b => b.onclick = () => { SP.pools.splice(+b.dataset.spdel, 1); SP.dirty = true; renderSpawns(); });
  $("spAdd").onclick = () => {
    const v = $("spAddSel").value; if(!v) return toast("Pick a map first.");
    const [scene, group] = v.split("|"); const a = d.addable.find(x => x.scene===scene && String(x.group)===group); const lo = Number($("spAddMin").value), hi = Number($("spAddMax").value);
    if(Number.isNaN(lo) || Number.isNaN(hi) || lo<0 || hi<lo) return toast("Min must be 0 or more, and max must not be smaller than min.");
    SP.pools.push({scene, mapId:a.mapId, map:a.map, group:a.group, points:a.points, min:lo, max:hi, origMin:null, origMax:null, usedMax:a.usedMax+hi, kinds:a.kinds+1}); SP.dirty = true; renderSpawns();
  };
  $("spSave").onclick = async () => {
    try{ const r = await api("/api/spawns/set", {id:SP.id, pools:SP.pools.map(p=>({scene:p.scene, group:p.group, min:p.min, max:p.max})), fixed:SP.fixed.map(p=>({scene:p.scene, group:p.group, total:p.total}))});
      SP = {d:r, pools:JSON.parse(JSON.stringify(r.pools)), fixed:JSON.parse(JSON.stringify(r.fixed)), dirty:false, id:SP.id}; renderSpawns(); toast("Spawns saved. Press Apply spawns to game to write them.", true); }
    catch(e){ toast(e.message); } };
  $("spReset").onclick = async () => { try{ const r = await api("/api/spawns/reset", {id:SP.id}); SP = {d:r, pools:JSON.parse(JSON.stringify(r.pools)), fixed:JSON.parse(JSON.stringify(r.fixed)), dirty:false, id:SP.id}; renderSpawns(); toast("Back to the original spawns.", true);}catch(e){toast(e.message);} };
  $("spApply").onclick = async () => { if(SP.dirty && !confirm("You have spawn changes that are not saved. Apply without them?")) return;
    $("spApply").disabled = true;
    try{ const r = await api("/api/spawns/apply", {}); toast("Applied to "+r.scenes+" map file"+(r.scenes===1?"":"s")+". Restart the server to use them.", true); await loadSpawns(SP.id); }catch(e){ toast(e.message); $("spApply").disabled = false; } };
  $("spRestore").onclick = async () => { if(!confirm("Put the untouched original spawn files back in the game folder? (A backup is made first. Your edits stay saved.)")) return;
    try{ await api("/api/spawns/restore-original", {}); await loadSpawns(SP.id); toast("Original spawn files restored. Restart the server.", true);}catch(e){toast(e.message);} };
  $("spDiscard").onclick = async () => { if(!confirm("Throw away ALL your saved spawn edits (every monster)?")) return;
    try{ await api("/api/spawns/reset-all", {}); await loadSpawns(SP.id); toast("Spawn edits discarded.", true);}catch(e){toast(e.message);} };
  if($("spRebase")) $("spRebase").onclick = async () => { if(!confirm("Use the current scene files as the new untouched originals? Your edits are kept and laid on top.")) return;
    try{ await api("/api/spawns/rebaseline", {}); await loadSpawns(SP.id); toast("Current scene files are now the originals.", true);}catch(e){toast(e.message);} };
}
$("btnApply").onclick = async ()=>{
  $("btnApply").disabled = true;
  try{ const r = await api("/api/mobs/apply", {}); META = r.meta; toast("Applied "+r.mobs+" monster"+(r.mobs===1?"":"s")+". Restart the server to use them.", true); }catch(e){ toast(e.message); }
  renderMeta();
};
$("btnRebase").onclick = async ()=>{ if(!confirm("Use the current NPCConfig, AttriMonsterConfig and AIConfig as the new untouched originals? Your edits are kept and laid on top.")) return;
  try{ META = await api("/api/mobs/rebaseline", {}); renderMeta(); await load(); toast("Current files are now the originals.", true);}catch(e){toast(e.message);} };
$("btnRestore").onclick = async ()=>{ if(!confirm("Put the three untouched original tables back in the game folder? (A backup is made first. Your edits stay saved.)")) return;
  try{ META = await api("/api/mobs/restore-original", {}); renderMeta(); toast("Originals restored. Restart the server.", true);}catch(e){toast(e.message);} };
$("btnDiscard").onclick = async ()=>{ if(!confirm("Throw away ALL your saved monster edits?")) return;
  try{ META = await api("/api/mobs/reset-all", {}); renderMeta(); await load(); if(cur) open(cur); toast("Edits discarded.", true);}catch(e){toast(e.message);} };
$("rows").onclick = e => { const tr = e.target.closest("tr.row"); if(tr) open(+tr.dataset.id); };
$("prev").onclick = () => { page--; load(); }; $("next").onclick = () => { page++; load(); };
let timer = null;
["q","lo","hi"].forEach(i => $(i).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(()=>{ page=1; load().catch(e=>toast(e.message)); }, 250); }));
["cls","race","size","element","sort","desc","unnamed"].forEach(i => $(i).addEventListener("change", () => { page=1; load().catch(e=>toast(e.message)); }));
(async () => {
  try{ META = (await api("/api/mobs/meta")); if(stale(META)) return; fillSelect($("race"),"All races",META.races); fillSelect($("size"),"All sizes",META.sizes); fillSelect($("element"),"All elements",META.elements); renderMeta(); await load(); }
  catch(e){ toast(e.message); }
})();
</script>
</body>
</html>
